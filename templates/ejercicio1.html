
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1 | Notas y asistencia</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>

<body>

    <main class="contenedor">
        <section class="tarjeta">

            <h1>Formulario de Notas</h1>

            <p class="descripcion">
                Ingresa las tres notas y el porcentaje de asistencia del estudiante.
            </p>
            {% if error %}
                <p class="mensaje-error">{{ error }}</p>
            {% endif %}

            <form action="{{ url_for('ejercicio1') }}" method="POST">

                <div class="grupo-formulario">
                    <label for="nota1">Nota 1:</label>
                    <input type="number" id="nota1" name="nota1"
                           min="10" max="70" step="1" required>
                </div>

                <div class="grupo-formulario">
                    <label for="nota2">Nota 2:</label>
                    <input type="number" id="nota2" name="nota2"
                           min="10" max="70" step="1" required>
                </div>

                <div class="grupo-formulario">
                    <label for="nota3">Nota 3:</label>
                    <input type="number" id="nota3" name="nota3"
                           min="10" max="70" step="1" required>
                </div>

                <div class="grupo-formulario">
                    <label for="asistencia">Asistencia (%):</label>
                    <input type="number" id="asistencia" name="asistencia"
                           min="0" max="100" step="1" required>
                </div>

                <button type="submit" class="boton">
                    Enviar
                </button>

            </form>

            <a href="{{ url_for('index') }}" class="volver">
                Volver al menú principal
            </a>

        </section>
    </main>

</body>
</html>
